<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vue + Express Demo</title>
  <!-- Include Vue 3 from a CDN for simplicity -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
</head>
<body>
  <div id="app">
    <h1>{{ greeting }}</h1> <!-- displays the greeting variable defined below in the Vue script -->
     <!-- Generic greeting grabbed when app starts -->
     <p>{{  serverResponse }}</p>

    <!-- @click is used to connect to a view method - randoResponse holds data fetched from server.js  -->
    <button @click="fetchServerData">Fetch Server Data</button>
    <p>{{ randoResponse }}</p>

     <!-- Input for the user's name -->
     <p>Enter your name:</p>
     <input v-model="userName" />
     <!-- Button calls fetchPersonalized with the userName -->
     <button @click="fetchPersonalized(userName)">Greet Me</button>
     <!-- Personalize greet response -->
     <p>{{  greetResponse }}</p>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
  data() {
    return {
      serverResponse: "",
      greetResponse: "",
      randoResponse: "",
      greeting: "Hello from Vue!"// a vue variable that we are using locally. not for retrieving data from server.js
    };
  },
  created() {
    // Auto-fetch data at component creation
    this.fetchServerData();
    this.fetchGreet()
  },
  methods: {
    async fetchServerData() {
      try {
        const res = await fetch("/api/data");
        const json = await res.json();
        this.randoResponse = json.message;
      } catch (err) {
        console.error("Error fetching server data:", err);
      }
    },
    async fetchGreet() {
    const res = await fetch("/api/greet");
    const json = await res.json();
    this.serverResponse = json.message;
  },
  // In Vue:
async fetchPersonalized(name) {
  const res = await fetch(`/api/hello?name=${encodeURIComponent(name)}`);
  const json = await res.json();
  this.greetResponse = json.message;
},
    refreshData() {
      // Maybe you do some special "reset" logic before fetching again
      this.serverResponse = "";
      this.fetchServerData();
    }
  }
}).mount("#app");

  </script>
</body>
</html>
