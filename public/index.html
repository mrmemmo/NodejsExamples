<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Basic Chat App</title>
</head>
<body>
  <div id="app">
    <h1>Socket.IO + Vue Chat</h1>
    
    <!-- User Name -->
    <p>
      Your Name:
      <input v-model="userName" placeholder="Enter your name" />
    </p>

    <!-- Chat Input -->
    <p>
      Message:
      <input v-model="chatText" placeholder="Type a message" />
      <button @click="sendChat">Send</button>
    </p>

    <hr />

    <!-- Chat Display -->
    <ul>
      <!-- Loop through all messages -->
      <li v-for="(msg, index) in messages" :key="index">
        <strong>{{ msg.name }}:</strong> {{ msg.text }}
      </li>
    </ul>
  </div>

  <!-- Vue 3 from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
  
  <!-- Socket.IO client script (served by our server at /socket.io/socket.io.js) -->
  <script src="/socket.io/socket.io.js"></script>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          userName: "",
          chatText: "",
          messages: []
        };
      },
      mounted() {
        // 1) Connect to the Socket.IO server
        this.socket = io();

        // 2) Receive the entire chat history (only once, right after we connect)
        this.socket.on("chatHistory", (serverMessages) => {
          this.messages = serverMessages;
        });

        // 3) When a new message arrives from the server
        this.socket.on("chatMessage", (newMessage) => {
          this.messages.push(newMessage);
        });
      },
      methods: {
        sendChat() {
          // Trim input and ensure we have a name + message
          const name = this.userName.trim();
          const text = this.chatText.trim();
          if (!name || !text) {
            return; // do nothing if missing data
          }
          
          // Emit an event to the server with our name + message
          const payload = { name, text };
          this.socket.emit("sendChat", payload);

          // Clear chat text
          this.chatText = "";
        }
      }
    }).mount("#app");
  </script>
</body>
</html>
